{% extends 'base.html' %}
{% block title %}{{ 'Edit' if service else 'Add' }} Service - InventorPro{% endblock %}
{% block content %}
<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">{{ 'Edit' if service else 'Add' }} Service</h1>
</div>

<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Service Details</h6>
    </div>
    <div class="card-body">
        <form method="post" action="{{ action }}">
            <div class="form-row">
                <div class="form-group col-md-5">
                    <label>Name</label>
                    <input type="text" name="name" class="form-control" value="{{ service.name if service else '' }}" required>
                </div>
                <div class="form-group col-md-3">
                    <label>Category</label>
                    <select name="category" class="form-control" required>
                        {% for c in ['Lashes', 'Nails'] %}
                        <option value="{{ c }}" {% if service and service.category == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                        <option value="{{ service.category }}" {% if service and service.category not in ['Lashes', 'Nails'] %}selected{% else %}disabled hidden{% endif %}>{{ service.category or 'Other' }}</option>
                    </select>
                </div>
                <div class="form-group col-md-2">
                    <label>Duration (mins)</label>
                    <input type="number" name="duration_minutes" class="form-control" min="5" step="5" value="{{ service.duration_minutes if service else 30 }}" required>
                </div>
                <div class="form-group col-md-2">
                    <label>Price</label>
                    <input type="number" name="price" class="form-control" step="0.01" min="0" value="{{ service.price if service else 0 }}" required>
                </div>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select name="status" class="form-control">
                    <option value="1" {% if service and service.status == 1 %}selected{% endif %}>Active</option>
                    <option value="0" {% if service and service.status == 0 %}selected{% endif %}>Inactive</option>
                </select>
            </div>

            <hr>
            <button type="submit" class="btn btn-primary">Save Service</button>
            <a href="{{ url_for('services.index') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
