{% extends 'base.html' %}
{% block title %}Forgot Password - InventorPro{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-6 col-lg-8 col-md-9">
        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-2">Forgot Password?</h1>
                                <p class="mb-4 text-muted">Enter your email and we'll send you a 6-digit reset code.</p>
                            </div>
                            <form class="user" method="post">
                                <div class="form-group">
                                    <input type="email" name="email" class="form-control form-control-user" placeholder="Email Address" required value="{{ email or '' }}">
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block">Send Reset Code</button>
                            </form>
                            <hr>
                            <div class="text-center">
                                <a class="small" href="{{ url_for('auth.login') }}">Back to Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
