{% extends 'base.html' %}
{% block title %}Enter Reset Code - InventorPro{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-6 col-lg-8 col-md-9">
        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-2">Enter 6-Digit Code</h1>
                                <p class="mb-4 text-muted">We sent a reset code to your email.</p>
                                <p class="mb-4">Code expires in: <strong id="timer" class="text-primary">0:00</strong></p>
                            </div>
                            <form class="user text-center" method="post" id="otp-form">
                                <div class="d-flex justify-content-center mb-4">
                                    {% for i in range(6) %}
                                    <input type="text" name="otp[]" maxlength="1" inputmode="numeric" pattern="[0-9]" required class="form-control form-control-user text-center font-weight-bold mx-1" style="width: 55px; height: 60px; font-size: 1.5rem; border-radius: 10px;">
                                    {% endfor %}
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block" id="submit-btn">Verify Code</button>
                            </form>
                            <hr>
                            <div class="text-center">
                                <a class="small" href="{{ url_for('auth.forgot_password') }}">Resend Code</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    (function() {
        let remaining = {{ remaining }};
        const timerEl = document.getElementById('timer');
        const submitBtn = document.getElementById('submit-btn');
        const inputs = document.querySelectorAll('input[name="otp[]"]');

        function updateTimer() {
            if (remaining <= 0) {
                clearInterval(interval);
                timerEl.textContent = 'Expired';
                timerEl.classList.remove('text-primary');
                timerEl.classList.add('text-danger');
                submitBtn.disabled = true;
                inputs.forEach(function(i) { i.disabled = true; });
                return;
            }
            const m = Math.floor(remaining / 60);
            const s = remaining % 60;
            timerEl.textContent = m + ':' + (s < 10 ? '0' + s : s);
            remaining--;
        }

        const interval = setInterval(updateTimer, 1000);
        updateTimer();

        inputs.forEach(function(input, idx) {
            input.addEventListener('input', function() {
                input.value = input.value.replace(/[^0-9]/g, '');
                if (input.value && idx < inputs.length - 1) {
                    inputs[idx + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !input.value && idx > 0) {
                    inputs[idx - 1].focus();
                }
            });
        });
    })();
</script>
{% endblock %}
