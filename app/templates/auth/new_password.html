{% extends 'base.html' %}
{% block title %}New Password - InventorPro{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-6 col-lg-8 col-md-9">
        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-2">Set New Password</h1>
                                <p class="mb-4 text-muted">Create a new password for <strong>{{ email }}</strong>.</p>
                            </div>
                            <form class="user" method="post">
                                <div class="form-group">
                                    <input type="password" name="password" class="form-control form-control-user" placeholder="New Password" minlength="6" required>
                                </div>
                                <div class="form-group">
                                    <input type="password" name="confirm_password" class="form-control form-control-user" placeholder="Confirm New Password" minlength="6" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block">Save New Password</button>
                            </form>
                            <hr>
                            <div class="text-center">
                                <a class="small" href="{{ url_for('auth.login') }}">Back to Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
