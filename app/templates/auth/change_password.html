{% extends 'base.html' %}
{% block title %}Change Password - InventorPro{% endblock %}
{% block content %}
<div class="modal fade show" id="changePasswordModal" tabindex="-1" role="dialog" data-backdrop="static" data-keyboard="false" style="display: block;">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header bg-gradient-primary text-white">
                <h5 class="modal-title font-weight-bold">Set Your Password</h5>
            </div>
            <div class="modal-body p-5">
                <p class="text-muted text-center small">You are logging in for the first time. Please create a new password before continuing.</p>
                <form method="post">
                    <div class="form-group">
                        <input type="password" name="password" class="form-control form-control-user" placeholder="New Password" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <input type="password" name="confirm_password" class="form-control form-control-user" placeholder="Confirm New Password" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-user btn-block">Save Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="modal-backdrop fade show"></div>
{% endblock %}
